pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'LevelUpAcademy'

expoAutolinking.useExpoVersionCatalog()

include ':app'

def reactNativeAndroidProjects = [
  'react-native-async-storage_async-storage': '../node_modules/@react-native-async-storage/async-storage/android',
  'react-native-google-signin_google-signin': '../node_modules/@react-native-google-signin/google-signin/android',
  'lottie-react-native': '../node_modules/lottie-react-native/android',
  'react-native-gesture-handler': '../node_modules/react-native-gesture-handler/android',
  'react-native-reanimated': '../node_modules/react-native-reanimated/android',
  'react-native-safe-area-context': '../node_modules/react-native-safe-area-context/android',
  'react-native-screens': '../node_modules/react-native-screens/android',
  'react-native-svg': '../node_modules/react-native-svg/android',
  'react-native-webview': '../node_modules/react-native-webview/android',
  'react-native-worklets': '../node_modules/react-native-worklets/android',
]

reactNativeAndroidProjects.each { projectName, projectPath ->
  include ":${projectName}"
  project(":${projectName}").projectDir = new File(rootDir, projectPath)
}

includeBuild(expoAutolinking.reactNativeGradlePlugin)
